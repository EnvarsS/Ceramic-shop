spring.application.name=cart-service

server.port=4022
spring.datasource.url=jdbc:mysql://cart-db:3306/cart_db
spring.datasource.username=cart_user
spring.datasource.password=cart_pass
eureka.client.service-url.defaultZone=http://discovery-service:4050/eureka/
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:db/changelog/db.master-changelog.yaml


spring.kafka.consumer.group-id=cart-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=cartProduct:org.envycorp.productservice.model.event.CartProductEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*