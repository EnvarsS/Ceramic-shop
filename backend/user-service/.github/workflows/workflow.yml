name: user-service.ci
on:
  pull_request:
    branches: [develop, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Copy all code
        uses: actions/checkout@v4

      - name: Run JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests only
        run: mvn clean test

  integrational-test:
    runs-on: ubuntu-latest

    steps:
      - name: Copy all code
        uses: actions/checkout@v4

      - name: Run JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests only
        run: mvn clean verify

  build:
    if: github.base_ref == 'main'
    needs: integrational-test
    runs-on: ubuntu-latest

    steps:
      - name: Copy all code
        uses: actions/checkout@v4

      - name: Run JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests only
        run: mvn clean install
