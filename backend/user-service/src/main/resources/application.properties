spring.application.name=user-service
server.port=4011

spring.datasource.url=jdbc:postgresql://user-db:5432/user_db
spring.datasource.username=user
spring.datasource.password=pass

spring.jpa.hibernate.ddl-auto=none

eureka.client.service-url.defaultZone=http://discovery-service:4050/eureka/

spring.kafka.bootstrap-servers=kafka-broker:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.type.mapping=authEvent:org.envycorp.userservice.model.event.AuthEvent

spring.kafka.consumer.group-id=user-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
