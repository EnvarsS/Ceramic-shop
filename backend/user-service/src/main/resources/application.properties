spring.application.name=user-service
server.port=4011

spring.datasource.url=jdbc:postgresql://user-db:5432/user_db
spring.datasource.username=user
spring.datasource.password=pass

spring.jpa.hibernate.ddl-auto=none

eureka.client.service-url.defaultZone=http://discovery-service:4050/eureka/

spring.kafka.bootstrap-servers=kafka-broker:9092
spring.kafka.template.default-topic=user-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
