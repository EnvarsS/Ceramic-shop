spring.application.name=product-service

server.port=4021

eureka.client.service-url.defaultZone=http://discovery-service:4050/eureka/

spring.datasource.url=jdbc:mysql://ceramic-product-db:3306/product_db
spring.datasource.username=product_user
spring.datasource.password=product_pass

spring.kafka.bootstrap-servers=kafka-broker:29092
spring.kafka.template.default-topic=product-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=cartProduct:org.envycorp.productservice.model.event.CartProductEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
