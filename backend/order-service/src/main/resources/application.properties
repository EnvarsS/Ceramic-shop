spring.application.name=order-service

server.port=4023
spring.datasource.url=jdbc:mysql://order-db:3306/order_db
spring.datasource.username=order_user
spring.datasource.password=order_pass
eureka.client.service-url.defaultZone=http://discovery-service:4050/eureka/
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:db/changelog/db.master-changelog.yaml