spring.application.name=auth-service

server.port=4010

spring.datasource.url=jdbc:mysql://auth-db:3306/auth_db
spring.datasource.username=auth_user
spring.datasource.password=auth_pass

eureka.client.service-url.defaultZone=http://discovery-service:4050/eureka/

spring.kafka.bootstrap-servers=kafka-broker:29092
spring.kafka.template.default-topic=auth-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=authEvent:org.envycorp.authservice.model.event.AuthEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*