version: "3.9"

services:
  user-db:
    image: postgres:alpine
    container_name: ceramic-user-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: user_db
    volumes:
      - user-db-data:/var/lib/postgresql/data

  auth-db:
    image: mysql:latest
    container_name: ceramic-auth-db
    environment:
      MYSQL_ROOT_PASSWORD: auth_pass
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    volumes:
      - auth-db-data:/var/lib/mysql

  product-db:
    image: mysql:latest
    container_name: ceramic-product-db
    environment:
      MYSQL_ROOT_PASSWORD: product_pass
      MYSQL_DATABASE: product_db
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_pass
    volumes:
      - product-db-data:/var/lib/mysql

  cart-db:
    image: mysql:latest
    container_name: ceramic-cart-db
    environment:
      MYSQL_ROOT_PASSWORD: cart_pass
      MYSQL_DATABASE: cart_db
      MYSQL_USER: cart_user
      MYSQL_PASSWORD: cart_pass
    volumes:
      - cart-db-data:/var/lib/mysql

  user-service:
    depends_on:
      - user-db
      - discovery-service
    restart: always
    build: /backend/user-service
    container_name: user-service

  auth-service:
    depends_on:
      - auth-db
      - discovery-service
    restart: always
    build: /backend/auth-service
    container_name: auth-service

  discovery-service:
    restart: always
    build: /backend/discovery-service
    container_name: discovery-service

  product-service:
    depends_on:
      - product-db
      - discovery-service
    restart: always
    build: /backend/product-service
    container_name: product-service

  cart-service:
    depends_on:
      - cart-db
      - discovery-service
    restart: always
    build: /backend/cart-service
    container_name: cart-service

  api-gateway:
    depends_on:
      - discovery-service
    restart: always
    build: /backend/api-gateway
    container_name: api-gateway
    ports:
      - "4020:4020"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

networks:
  ceramic-network:
    driver: bridge

volumes:
  user-db-data:
  auth-db-data:
  product-db-data:
  cart-db-data: