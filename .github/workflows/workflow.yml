name: microservices.ci

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, auth-service, product-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Run IT tests
        run: mvn clean verify

  build:
    runs-on: ubuntu-latest
    needs: integration-tests
    strategy:
      matrix:
        service: [user-service, discovery-service, auth-service, api-gateway, product-service, cart-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Run IT tests
        run: mvn clean install -DskipTests